version: "3.8"

services:
  web:
    build: .
    container_name: cv-web
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - cv-network

  db:
    image: mysql:8
    container_name: cv-db
    environment:
      MYSQL_ROOT_PASSWORD: monpassword
      MYSQL_DATABASE: cvdata
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/Ntable.sql
    ports:
      - "3306:3306"
    networks:
      - cv-network

volumes:
  mysql-data:

networks:
  cv-network:
